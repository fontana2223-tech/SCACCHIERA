<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scacchiera</title>
    <link rel="stylesheet" href="style.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=SN+Pro:ital,wght@0,200..900;1,200..900&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1>SCACCHIAMO</h1>
        <p>GIOCA AL GIOCO DI SCACCHI NUMERO 1 AL MONDO!</p>
        <a href="https://it.wikipedia.org/wiki/Scacchi">un piccolo tutorial prima di iniziare</a>
    </header>

    <table class="chess-board">
        <thead>
            <tr>
                <th></th><th>a</th><th>b</th><th>c</th><th>d</th><th>e</th><th>f</th><th>g</th><th>h</th><th></th>
            </tr>
        </thead>
        <tbody>
            <tr> 
                <th>8</th>
                <td class="light black-p">♜</td><td class="dark black-p">♞</td><td class="light black-p">♝</td><td class="dark black-p">♛</td>
                <td class="light black-p">♚</td><td class="dark black-p">♝</td><td class="light black-p">♞</td><td class="dark black-p">♜</td>
                <th>8</th>
            </tr>
            <tr>
                <th>7</th>
                <td class="dark black-p">♟</td><td class="light black-p">♟</td><td class="dark black-p">♟</td><td class="light black-p">♟</td>
                <td class="dark black-p">♟</td><td class="light black-p">♟</td><td class="dark black-p">♟</td><td class="light black-p">♟</td>
                <th>7</th>
            </tr>
            
            <tr><th>6</th><td class="light"></td><td class="dark"></td><td class="light"></td><td class="dark"></td><td class="light"></td><td class="dark"></td><td class="light"></td><td class="dark"></td><th>6</th></tr>
            <tr><th>5</th><td class="dark"></td><td class="light"></td><td class="dark"></td><td class="light"></td><td class="dark"></td><td class="light"></td><td class="dark"></td><td class="light"></td><th>5</th></tr>
            <tr><th>4</th><td class="light"></td><td class="dark"></td><td class="light"></td><td class="dark"></td><td class="light"></td><td class="dark"></td><td class="light"></td><td class="dark"></td><th>4</th></tr>
            <tr><th>3</th><td class="dark"></td><td class="light"></td><td class="dark"></td><td class="light"></td><td class="dark"></td><td class="light"></td><td class="dark"></td><td class="light"></td><th>3</th></tr>

            <tr>
                <th>2</th>
                <td class="light white-p">♟</td><td class="dark white-p">♟</td><td class="light white-p">♟</td><td class="dark white-p">♟</td>
                <td class="light white-p">♟</td><td class="dark white-p">♟</td><td class="light white-p">♟</td><td class="dark white-p">♟</td>
                <th>2</th>
            </tr>
            <tr>
                <th>1</th>
                <td class="dark white-p">♖</td><td class="light white-p">♞</td><td class="dark white-p">♝</td><td class="light white-p">♛</td>
                <td class="dark white-p">♔</td><td class="light white-p">♝</td><td class="dark white-p">♞</td><td class="light white-p">♜</td>
                <th>1</th>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th></th><th>a</th><th>b</th><th>c</th><th>d</th><th>e</th><th>f</th><th>g</th><th>h</th><th></th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
